[project]
name = "pico2-app"
version = "0.1.0"
description = "MicroPython application for Raspberry Pi Pico 2"
requires-python = ">=3.9"

# ------------------------------------------------------------------
# pyright / Pylance: MicroPython のスタブ(typings/)を標準ライブラリとして使う
# ------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
# src/maxm10 と src/micropyGPS.py はサブモジュールからの生成物(各リポジトリの書式のまま)
exclude = [".*", "__*", "**/typings", "tools", "src/maxm10", "src/micropyGPS.py"]
ignore = ["**/typings"]
extraPaths = ["src"]

typeCheckingMode = "basic"
stubPath = "typings"
typeshedPath = "typings"
pythonPlatform = "Linux"
pythonVersion = "3.8"

reportMissingModuleSource = "none"
reportUnnecessaryTypeIgnoreComment = "information"

# ------------------------------------------------------------------
# ruff: lint と format
# ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py38"
# サブモジュールからの生成物は各リポジトリの書式のまま(src/tnc は自分で書いたので検査する)
extend-exclude = ["typings", "src/maxm10", "src/micropyGPS.py"]
# MicroPython viper のポインタ型(実行時の組み込み名)
builtins = ["ptr", "ptr8", "ptr16", "ptr32", "uint"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# MicroPython ではよく使う書き方なので許可
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E501"]
"src/station.py" = ["E402"]  # 送信バッファをほかの import より先に確保するため
